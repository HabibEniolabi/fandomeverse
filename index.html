<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FandomVerse — discover stories, characters, trailers, events, releases and collectibles across seven fandom universes." />
    <meta name="theme-color" content="#F7F4ED" />
    <title>FandomVerse — Your Universe. Your Fandom.</title>
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme');
          var s = localStorage.getItem('fv-theme');
          var t = p === 'dark' || p === 'light' ? p : s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
